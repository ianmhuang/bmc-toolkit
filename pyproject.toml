[project]
name = "bmc-toolkit"
version = "0.9.0"
description = "Claude Code skills for BMC firmware developers."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "curl_cffi>=0.10",
    "pypdfium2>=5",
    "pdfplumber>=0.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "black>=24",
]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88
# Acceptance tests are written by the revali reviewer and left as written.
extend-exclude = ["tests/test_review_*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Listing fixtures carry publisher URLs and HTML rows that do not wrap.
"tests/test_listing.py" = ["E501"]
"tests/test_freshness.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
