# ---------------------------------------------------------------- OCP
# opencompute.org/documents/<slug> serves the PDF directly but the slug is
# human-written and a re-upload may add a numeric suffix; every URL here was
# confirmed by hand on 2026-09-03. The site rejects non-browser TLS
# fingerprints. DC-MHS has no umbrella document; it is the set of M-* specs.
# Publication dates come from the OCP wiki specification tables, which is also
# what "listing" points at ("ocp:<wiki page>|<description prefix>"); the wiki
# links newer versions to Google Drive, so `check` reports them and a human
# finds the opencompute.org/documents slug.

[[documents]]
id = "DC-SCM"
family = "ocp-dcscm"
listing = "ocp:Server/MHS/DC-SCM-Specs-and-Designs|OCP DC-SCM"
title = "Datacenter-ready Secure Control Module (DC-SCM) Specification"
access = "open"
fetch = "direct"
limits = "Tables are images: use page and render; table finds nothing on those pages."
notes = "Rev 2.0 Ver 1.0 exists only as a Google Drive link on the OCP wiki: fetch prints the browser instruction for it. The DC-SCI pin list is a spreadsheet on the same wiki page, not a document the tool holds."

