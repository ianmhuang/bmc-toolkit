url = "https://github.com/openbmc/openbmc.git"
topics = ["release", "yocto", "recipes", "distro"]
sparse = ["/meta-*/**/*.bb", "/meta-*/**/*.inc"]
# The OpenBMC distribution: Yocto layers and the recipes that pin every component (releases live here)

[[repos]]
id = "linux"
url = "https://github.com/openbmc/linux.git"
topics = ["kernel", "docs", "hwmon", "i2c", "gpio", "peci", "ipmi", "ncsi", "mctp", "spi-nor", "sysfs"]
