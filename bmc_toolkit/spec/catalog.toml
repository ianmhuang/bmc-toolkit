# ------------------------------------------------------------------ repos
#
# Code repositories the Skill can bring into the Library as Code Trees.
# Upstream OpenBMC only. "topics" are keywords for `repos --topic`;
# "sparse" limits the checkout to the listed directories, or, with glob
# patterns, to the matching files (openbmc/openbmc is held only for the
# recipe files of every layer, which pin every component in a release).

[[repos]]
id = "openbmc"
url = "https://github.com/openbmc/openbmc.git"
topics = ["release", "yocto", "recipes", "distro"]
sparse = ["/meta-*/**/*.bb", "/meta-*/**/*.inc"]
# The OpenBMC distribution: Yocto layers and the recipes that pin every component (releases live here)

[[repos]]
id = "bmcweb"
url = "https://github.com/openbmc/bmcweb.git"
topics = ["redfish", "web", "rest", "http", "chassis", "systems"]
# Redfish and web server

[[repos]]
id = "phosphor-host-ipmid"
url = "https://github.com/openbmc/phosphor-host-ipmid.git"
topics = ["ipmi", "kcs", "sensors", "sdr", "sel", "fru"]
# IPMI host interface daemon and command handlers

[[repos]]
