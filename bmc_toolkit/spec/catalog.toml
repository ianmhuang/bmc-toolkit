# Source Catalog for the bmc-spec skill.
#
# What exists, which versions, and where each one is downloaded from. Read
# by bmc_toolkit/spec/catalog.py; the schema is documented there. Version
# strings are the publisher's own, verbatim. "published" decides which
# version is latest; Work-in-Progress entries carry wip = true and are never
# latest unless asked for.
#
# access: open (direct public download) | gated (free registration or
#         click-through) | member (paid or member-only) | confidential (NDA)
# fetch:  direct (publisher URL, then Wayback, then manual) | wayback
#         (publisher blocks scripts; Internet Archive only) | manual (never
#         downloaded; the user places the file)
#
# Comments record when a URL was last confirmed reachable by the fetch code.

schema_version = 1

