name: catalog

# Once a month, ask the publishers' listings what the Source Catalog lacks.
# The catalog is never written here: when refresh reports something to add,
# confirm or change, an issue carries the output to the maintainer, who runs
# refresh --write, verifies the new versions and bumps through a pull request.

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  refresh:
    if: github.repository == 'ianmhuang/bmc-toolkit'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: refresh (dry run)
        id: refresh
        shell: bash
        run: |
          python skills/bmc-spec/scripts/bmcspec.py refresh | tee refresh.txt
          {
            echo '## refresh'
            echo '```'
            cat refresh.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          proposals=$(grep '^summary:' refresh.txt | grep -oE '(add|confirm|changed) [0-9]+' | awk '{ s += $2 } END { print s + 0 }')
          echo "proposals=$proposals" >> "$GITHUB_OUTPUT"
      - name: open or comment on the catalog issue
        if: steps.refresh.outputs.proposals != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const { owner, repo } = context.repo;
            const label = "catalog";
            const run = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = [
              "`refresh` found what the Source Catalog lacks. Run `refresh --write`",
              "locally, confirm any OCP URL by hand, verify each new version against",
              "`docs/golden-questions.md`, bump `plugin.json`, and open a pull request",
              "(docs/CATALOG.md).",
              "",
              "```",
              fs.readFileSync("refresh.txt", "utf8").trimEnd(),
              "```",
              "",
              `Run: ${run}`,
            ].join("\n");
            try {
              await github.rest.issues.getLabel({ owner, repo, name: label });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                owner, repo, name: label, color: "2F5D7C",
                description: "Publishers list something the Source Catalog lacks",
              });
            }
            const open = (await github.rest.issues.listForRepo({
              owner, repo, state: "open", labels: label, per_page: 10,
            })).data.filter((issue) => !issue.pull_request);
            if (open.length > 0) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: open[0].number, body,
              });
              core.info(`commented on #${open[0].number}`);
            } else {
              const month = new Date().toISOString().slice(0, 7);
              const issue = await github.rest.issues.create({
                owner, repo, title: `Catalog refresh ${month}`, labels: [label], body,
              });
              core.info(`opened #${issue.data.number}`);
            }
